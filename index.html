<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faithful Learner · Living Worlds</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3df;color:#263e35;font-family:Trebuchet MS,system-ui,sans-serif}button{cursor:pointer;font:inherit;border:0}button:focus-visible,[tabindex]:focus-visible{outline:4px solid #e6a327;outline-offset:3px}header{background:#173d37;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:1.3rem}header button{background:#d5e9cd;color:#183b30;padding:10px 14px;border-radius:30px}main{max-width:1100px;margin:auto;padding:18px}h1{font-size:clamp(2.1rem,6vw,4.4rem);line-height:1.08;margin:12px 0}h2{font-size:1.65rem}p{line-height:1.55}.intro{background:#dcebcf;border-radius:28px;padding:24px;margin:10px 0 20px;overflow:hidden}.intro .art{font-size:clamp(3rem,8vw,6rem);letter-spacing:.15em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.tile{border-radius:25px;overflow:hidden;background:white;box-shadow:0 5px 0 #d9dfca}.tile .top{height:160px;display:grid;place-items:center;font-size:5rem;background:linear-gradient(145deg,#b8e3cb,#f3d995)}.tile:nth-child(2) .top{background:linear-gradient(145deg,#b9d6f3,#d5e6bb)}.tile:nth-child(3) .top{background:linear-gradient(145deg,#edc7a8,#f2e7b6)}.tile .body{padding:18px}.tile button,.primary{background:#235e49;color:white;padding:13px 19px;border-radius:15px;font-weight:bold}.back{background:#e0e8d6;color:#274537;border-radius:14px;padding:12px 17px}.world{border-radius:30px;overflow:hidden;background:#c5e7db;position:relative;box-shadow:0 8px 0 #d7dfca}.world svg{display:block;width:100%;height:auto;max-height:550px;touch-action:manipulation}.world [data-hit]{cursor:pointer;transition:filter .2s}.world [data-hit]:hover{filter:brightness(1.15)}.world [data-hit]:focus{outline:none;filter:drop-shadow(0 0 9px #fff)}.hud{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:16px 0}.pill{background:#fff;padding:12px 18px;border-radius:30px;font-weight:bold}.message{background:#fff;border-radius:22px;padding:18px;margin:16px 0;min-height:90px;font-size:1.25rem}.choice{padding:16px;border-radius:18px;background:#fff;border:3px solid #d2dec9;color:#274537;font-size:1.2rem}.choice.correct{background:#c8ebc8;border-color:#46936c}.choice.wrong{background:#ffe3b9;border-color:#d39d5a}.stars{color:#ba6b18}.small{font-size:.9rem;color:#52655a}.hidden{display:none!important}.butterfly{animation:float 3s ease-in-out infinite alternate;transform-origin:center}@keyframes float{to{transform:translate(0,-18px) rotate(5deg)}}.cloud{animation:drift 10s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(40px)}}.sun{animation:pulse 4s infinite alternate}@keyframes pulse{to{opacity:.75}}.sparkle{animation:pulse .6s infinite alternate}footer{text-align:center;padding:25px;color:#52655a}@media(max-width:560px){main{padding:12px}.intro{padding:18px}.tile .top{height:125px}.hud{align-items:stretch}.pill{width:100%}}
</style></head><body><header><strong>🌿 Faithful Learner</strong><button onclick="home()">Our Garden</button></header><main id="app"></main><footer>Made for curious minds · Progress is saved on this device</footer><script>
const kids={asher:{name:"Asher",age:7,tag:"Investigate, reason, discover",icon:"🔎"},joseph:{name:"Joseph",age:5,tag:"Explore, read, match",icon:"🦋"},caleb:{name:"Caleb",age:3,tag:"Touch, count, tell stories",icon:"🐞"}};let kid="asher",mode="",score=0,found=new Set(),round=0;const app=document.getElementById("app");const worlds=[["forest","The Living Forest","Discover animals, sounds and hidden life","🌳"],["dino","Dinosaur Valley","Excavate fossils and learn about ancient creatures","🦕"],["garden","The Growing Garden","Plant seeds, count and watch life grow","🌻"],["sky","The Wonder of the Sky","Explore the Moon, stars and the created world","🌙"]];const key=(m)=>"faithful-v2:"+kid+":"+m;function home(){app.innerHTML='<section class="intro"><h1>A whole world is waiting.</h1><p>Explore forests, discover dinosaurs, grow gardens and investigate the sky. Touch the world to see what happens.</p><div class="art">🌳 🦋 🦕 🌼</div></section><h2>Choose your explorer</h2><div class="grid">'+Object.entries(kids).map(([id,k])=>'<article class="tile"><div class="top">'+k.icon+'🌱</div><div class="body"><h2>'+k.name+'</h2><p>'+k.tag+'</p><button onclick="library(\''+id+'\')">Enter my world →</button></div></article>').join('')+'</div><p class="small">This version works without accounts. No child information is uploaded.</p>'}function library(id){kid=id;const k=kids[id];app.innerHTML='<button class="back" onclick="home()">← All explorers</button><section class="intro"><h1>'+k.name+'\'s World</h1><p>'+k.tag+'. Pick a place and begin exploring.</p><div class="stars">★ '+worlds.filter(w=>localStorage.getItem(key(w[0]))==="1").length+' of 4 worlds explored</div></section><div class="grid">'+worlds.map((w,i)=>'<article class="tile"><div class="top">'+w[3]+'</div><div class="body"><h2>'+w[1]+'</h2><p>'+w[2]+'</p><button onclick="enter(\''+w[0]+'\')">'+(localStorage.getItem(key(w[0]))?"Explore again":"Enter world")+' →</button></div></article>').join('')+'</div>'}function baseSky(night=false){return '<defs><linearGradient id="skygrad" x2="0" y2="1"><stop stop-color="'+(night?"#132e64":"#88cfe5")+'"/><stop offset="1" stop-color="'+(night?"#526da0":"#d7f1d4")+'"/></linearGradient><linearGradient id="hill" x2="0" y2="1"><stop stop-color="#7fba6e"/><stop offset="1" stop-color="#3e7956"/></linearGradient></defs><rect width="900" height="520" fill="url(#skygrad)"/>'+(night?'':'<g class="sun"><circle cx="744" cy="83" r="48" fill="#ffdc73"/></g><g class="cloud" fill="#fff" opacity=".82"><ellipse cx="160" cy="105" rx="85" ry="26"/><ellipse cx="205" cy="89" rx="46" ry="31"/><ellipse cx="520" cy="75" rx="75" ry="24"/></g>')+'<path d="M0 360 Q200 240 420 350 T900 310 V520 H0Z" fill="#a7cc8d"/><path d="M0 440 Q260 305 470 420 T900 360 V520 H0Z" fill="url(#hill)"/>'}function tree(x,y,s=1){return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="M-14 0 L-9 -150 9 -150 16 0" fill="#78553c"/><circle cy="-173" r="72" fill="#4c9565"/><circle cx="-42" cy="-150" r="51" fill="#61a874"/><circle cx="47" cy="-145" r="49" fill="#6eb97a"/></g>'}function hit(id,shape){return '<g data-hit="'+id+'" role="button" tabindex="0" aria-label="Discover '+id+'" onclick="discover(\''+id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \' ){event.preventDefault();discover(\''+id+'\')}">'+shape+'</g>'}function forest(){return baseSky()+tree(120,440,1.2)+tree(760,445,.95)+tree(490,425,.65)+hit("bird",'<g transform="translate(350 155)"><ellipse rx="39" ry="28" fill="#f5b05c"/><circle cx="22" cy="-19" r="23" fill="#f5b05c"/><path d="M43 -16l24 10-24 10" fill="#e6a139"/><circle cx="28" cy="-24" r="4" fill="#263e35"/><path d="M-10 0q-26-45-46-22" stroke="#d7854c" stroke-width="18" fill="none"/></g>')+hit("butterfly",'<g class="butterfly" transform="translate(605 230)"><ellipse cx="-19" cy="-15" rx="24" ry="33" fill="#e88eaa"/><ellipse cx="19" cy="-15" rx="24" ry="33" fill="#e88eaa"/><ellipse cx="-16" cy="17" rx="20" ry="24" fill="#f5bc75"/><ellipse cx="16" cy="17" rx="20" ry="24" fill="#f5bc75"/><path d="M0 -30v65" stroke="#523f57" stroke-width="8"/></g>')+hit("rabbit",'<g transform="translate(285 425)"><ellipse rx="52" ry="36" fill="#e4d6c1"/><ellipse cx="37" cy="-30" rx="29" ry="30" fill="#e4d6c1"/><ellipse cx="22" cy="-82" rx="12" ry="46" fill="#e4d6c1"/><ellipse cx="50" cy="-82" rx="12" ry="46" fill="#e4d6c1"/><circle cx="48" cy="-34" r="4" fill="#333"/><circle cx="-49" cy="-7" r="16" fill="#fff"/></g>')+hit("flower",'<g transform="translate(620 420)"><path d="M0 0v-88" stroke="#37764a" stroke-width="9"/>'+[0,60,120,180,240,300].map(a=>'<ellipse transform="rotate('+a+')" cy="-27" ry="28" rx="16" fill="#fff0a8"/>').join('')+'<circle r="17" fill="#dca54b"/></g>')}function dino(){return baseSky()+'<path d="M0 420Q250 370 500 430T900 400V520H0Z" fill="#d9ab76"/><path d="M40 430l140-160 120 160" fill="#a38e80"/><path d="M155 300l25-30 22 29" fill="#e5d5ba"/>'+hit("dinosaur",'<g transform="translate(510 340)"><path d="M-125 30 Q-225 30 -250 -60 Q-205 -30 -130 -24 Q-60 -120 90 -45 L160 -130 Q175 -154 193 -135 L203 -70 165 -45 Q140 45 40 60 L-40 65 -55 115 -94 115 -100 42 30 45 42 112 8 112 -12 65" fill="#6c9b77" stroke="#467c61" stroke-width="5"/><circle cx="178" cy="-115" r="6" fill="#173d37"/><path d="M165 -88q18 8 32-1" stroke="#335b47" stroke-width="4" fill="none"/><circle cx="-30" cy="-20" r="18" fill="#90ba87"/><circle cx="15" cy="-35" r="16" fill="#90ba87"/></g>')+hit("fossil",'<g transform="translate(230 440)"><ellipse rx="94" ry="37" fill="#ad7e55"/><path d="M-48 8 Q-5 -45 38 8 M-34 -5l-10-25 M-12 -18l-4-25 M15 -18l9-23 M37 -5l18-19" stroke="#f7e6bc" stroke-width="12" fill="none" stroke-linecap="round"/></g>')+hit("egg",'<g transform="translate(760 430)"><ellipse rx="39" ry="52" fill="#f7dfb1"/><circle cx="-12" cy="-4" r="9" fill="#cfac79"/><circle cx="17" cy="17" r="8" fill="#cfac79"/></g>')}function garden(){return baseSky()+'<path d="M0 425Q450 365 900 430V520H0Z" fill="#9e704e"/>'+[0,1,2,3,4].map(i=>hit("seed"+i,'<g transform="translate('+(155+i*145)+' 395)"><path d="M0 50V'+(-45-i*8)+'" stroke="#438d55" stroke-width="9"/><ellipse cx="-19" cy="-16" rx="26" ry="12" transform="rotate(28 -19 -16)" fill="#6bb56a"/><ellipse cx="20" cy="-38" rx="28" ry="12" transform="rotate(-32 20 -38)" fill="#72bb72"/><circle cy="'+(-65-i*8)+'" r="'+(i%2?27:21)+'" fill="'+(i%2?"#f7b2a1":"#f8d36e")+'"/><circle cy="'+(-65-i*8)+'" r="9" fill="#a16b41"/></g>')).join('')+hit("watering can",'<g transform="translate(760 350)"><path d="M-38 -18h90l-12 85h-66z" fill="#7fb4cd"/><path d="M48 2l70-27 10 16-76 43" fill="#7fb4cd"/><path d="M-28 -18q-2-75 50-65 28 5 23 65" stroke="#7fb4cd" stroke-width="14" fill="none"/></g>')}function sky(){return baseSky(true)+'<g fill="#fff7b8">'+Array.from({length:22},(_,i)=>'<circle cx="'+(30+(i*137)%840)+'" cy="'+(24+(i*79)%250)+'" r="'+(2+i%4)+'"/>').join('')+'</g>'+hit("moon",'<g transform="translate(690 125)"><circle r="65" fill="#fff0b7"/><circle cx="-20" cy="-15" r="11" fill="#e6d7a5"/><circle cx="19" cy="20" r="17" fill="#e6d7a5"/></g>')+hit("star",'<path d="M260 110l13 32 35 2-27 23 9 34-30-19-29 19 8-34-27-23 35-2z" fill="#ffe39b"/>')+hit("mountain",'<path d="M0 445l170-210 140 210 M260 445l190-265 220 265" fill="#647fa1"/><path d="M120 296l50-61 41 62 M399 242l51-62 50 61" fill="#d7e6ee"/></g>')}const notes={bird:["A bird sings from the branches.","Birds use songs to communicate."],butterfly:["The butterfly moves from flower to flower.","Butterflies begin life as caterpillars."],rabbit:["A rabbit has long ears and powerful legs.","Rabbits are mammals."],flower:["A flower grows toward the light.","Flowers can provide nectar for insects."],dinosaur:["A giant dinosaur walks through the valley!","Dinosaurs lived long before people."],fossil:["You uncovered a fossil!","Fossils are preserved traces of ancient life."],egg:["A mysterious egg! What might hatch?","Many dinosaurs laid eggs."],moon:["The Moon shines above the hills.","Moonlight is sunlight reflected from the Moon."],star:["You found a bright star!","Stars produce their own light."],mountain:["Look at the tall mountain.","Mountains can form when parts of Earth's crust move."],"watering can":["Water helps plants grow.","Plants need water, light and suitable conditions."]};function enter(m){mode=m;found=new Set();score=0;round=0;renderWorld()}function renderWorld(){const w=worlds.find(x=>x[0]===mode);app.innerHTML='<button class="back" onclick="library(\''+kid+'\')">← '+kids[kid].name+'\'s library</button><h1>'+w[1]+'</h1><p>Tap the animals and objects in the picture. Each one has something to teach you.</p><div class="hud"><span class="pill">✨ Discoveries: <b id="count">0</b></span><span class="pill stars" id="award">Explore to earn a star</span></div><div class="world"><svg viewBox="0 0 900 520" role="group" aria-label="Interactive illustrated '+w[1]+' scene">'+({forest:forest,dino:dino,garden:garden,sky:sky}[mode])()+'</svg></div><div class="message" id="message" aria-live="polite">👆 Touch something in the picture to begin.</div><div id="challenge"></div>';if(mode==="garden")document.getElementById("message").textContent="Find the five growing plants and count them!"}function discover(id){found.add(id);score=found.size;document.getElementById("count").textContent=score;const n=notes[id]||(id.startsWith("seed")?["A growing plant! Count each plant you find.","Plants need water and sunlight."]:["Look what you found!","Keep exploring."]);document.getElementById("message").textContent=(kid==="caleb"?n[0]:n[1])+' ✨';if(score>=3){localStorage.setItem(key(mode),"1");document.getElementById("award").textContent="★ World explorer!";challenge()}}function challenge(){if(document.getElementById("challenge").children.length)return;let q,choices,correct;if(mode==="forest"){q="Which creature begins life as a caterpillar?";choices=["Butterfly","Rabbit","Bird"];correct=0}else if(mode==="dino"){q="What helps us learn about ancient dinosaurs?";choices=["Fossils","Telephones","Clouds"];correct=0}else if(mode==="garden"){q="How many plants are growing in the garden?";choices=["3","5","8"];correct=1}else{q="Where does the Moon's light come from?";choices=["The Sun","A flashlight","A candle"];correct=0}if(kid==="caleb"){if(mode==="sky"){q="Touch the Moon!";choices=["🌙","🌼","🐞"];correct=0}else if(mode==="dino"){q="Which one is a dinosaur?";choices=["🦕","🐟","🐦"];correct=0}else if(mode==="forest"){q="Which one can fly?";choices=["🦋","🐇","🌳"];correct=0}else{q="Which one is a plant?";choices=["🌱","🦕","🌙"];correct=0}}document.getElementById("challenge").innerHTML='<section class="message"><h2>🌟 Your discovery challenge</h2><p>'+q+'</p><div class="grid">'+choices.map((x,i)=>'<button class="choice" onclick="choose(this,'+i+','+correct+')">'+x+'</button>').join('')+'</div><p id="result" aria-live="polite"></p><button class="primary hidden" id="more" onclick="library(\''+kid+'\')">Choose another world →</button></section>'}function choose(btn,i,c){document.querySelectorAll(".choice").forEach(b=>b.classList.remove("correct","wrong"));btn.classList.add(i===c?"correct":"wrong");document.getElementById("result").textContent=i===c?"Correct! You earned your explorer star.":"Look again and try another answer.";if(i===c)document.getElementById("more").classList.remove("hidden")}home();
</script></body></html>
