<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faithful Learner</title><style>:root{font-family:system-ui,sans-serif;color:#244332;background:#f8f6eb}*{box-sizing:border-box}body{margin:0}header{background:#244d39;color:white;padding:22px}main{max-width:1050px;margin:auto;padding:20px}h1{font-size:clamp(2rem,5vw,3.5rem)}button{border:0;background:#286347;color:white;padding:14px 20px;border-radius:14px;font:inherit;cursor:pointer;min-height:48px}button:focus-visible{outline:3px solid orange}.back{background:#dfe8d7;color:#244332}.hero{background:linear-gradient(125deg,#cce8bd,#f8e9b7);border-radius:25px;padding:25px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:16px}.card{background:white;border:2px solid #e0e8d9;border-radius:22px;padding:20px}.emoji{font-size:3.5rem}.scene{font-size:clamp(3rem,9vw,6rem);text-align:center;padding:35px;background:linear-gradient(#b8dfe7,#e5edb6);border-radius:20px}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.answers button{background:#e8e5cc;color:#244332}.muted{color:#4d6356}.reading{font-size:clamp(1.2rem,3vw,1.6rem);line-height:1.65}.notice{background:#fff0c6;padding:15px;border-radius:14px}footer{text-align:center;padding:25px} @media(max-width:520px){main{padding:12px}.card{padding:15px}}</style></head><body><header><strong>🌿 Faithful Learner</strong></header><main id="app"></main><footer>Our family learning garden · Progress stays on this device</footer><script>
const children={asher:{name:"Asher",age:7,icon:"🦕🔎",desc:"Read, investigate and explain"},joseph:{name:"Joseph",age:5,icon:"🦋📖",desc:"Read, match and discover"},caleb:{name:"Caleb",age:3,icon:"🐞🌼",desc:"Point, describe and tell stories"}};
const lessons=[
["The Quiet Garden","🌳🐦","Scripture & Nature","A bird sang in the garden. The child stopped to listen carefully and observe three different sounds.","A little bird sings in a tree. We stop and listen.","Look! A bird. Tweet, tweet! Can you sing like the bird?","What should an investigator do first?",["Listen carefully","Run away","Shout"],"What should we do when we hear a bird?",["Stop and listen","Shout","Hide"],"Which animal sings?",["🐦 Bird","🐟 Fish","🦕 Dinosaur"]],
["Dinosaur Valley","🌋🦕","Dinosaurs","Scientists study dinosaur fossils to learn about ancient life. Some dinosaurs ate plants and others ate meat.","A big dinosaur walks by trees. Fossils help us learn about dinosaurs.","A dinosaur! Stomp, stomp. Tell a dinosaur story.","What helps scientists study dinosaurs?",["Fossils","Clouds","Rainbows"],"What do fossils help us learn about?",["Dinosaurs","Cars","Telephones"],"Which is a dinosaur?",["🦕","🐞","🐦"]],
["Butterfly Changes","🐛🦋","Life Science","A caterpillar develops into a butterfly through metamorphosis. Describe the stages in order.","A caterpillar grows. Later it becomes a butterfly.","A caterpillar crawls. Then a butterfly flies!","What is this change called?",["Metamorphosis","Migration","Rainfall"],"What comes before the butterfly?",["Caterpillar","Kitten","Puppy"],"Which animal flies?",["🦋","🐛","🐌"]],
["Three Little Seeds","🌱🌱🌱","Numbers","Three seeds were planted. Two more were added. How many seeds were planted in all?","Three seeds are planted. One more is added. How many now?","One, two, three! Count the seeds.","What is 3 + 2?",["5","4","6"],"What is 3 + 1?",["4","2","5"],"How many seeds?",["3","2","1"]],
["The Helpful Neighbor","🐇🐿️","Kindness","A rabbit listened when a squirrel needed help gathering acorns. They worked together. Explain why listening matters.","The squirrel needs help. The rabbit asks, Can I help?","A squirrel drops acorns. The rabbit helps. What would you do?","What shows kindness?",["Offering help","Ignoring a friend","Taking everything"],"What did the rabbit offer?",["Help","A race","A rock"],"Which action is kind?",["Help a friend","Push a friend","Hide a toy"]],
["Lights in the Sky","🌙⭐","Sky & Creation","The Moon reflects sunlight while stars produce their own light. Psalm 19 invites us to notice the heavens.","We see stars and the Moon at night. The Moon reflects sunlight.","Look up! The Moon and stars. What do you see?","Where does moonlight come from?",["Reflected sunlight","Streetlights","Moon fire"],"What is in the night sky?",["Moon and stars","Fish","Trees"],"Which is the Moon?",["🌙","🐞","🌻"]]
];
let who=null,lesson=0;const app=document.getElementById("app");const saved=(c,i)=>localStorage.getItem("fl:"+c+":"+i)==="yes";function home(){who=null;app.innerHTML='<section class="hero"><h1>Welcome to Our Learning Garden</h1><p>Choose your own adventure in reading, nature, dinosaurs, science, numbers and Scripture.</p><div class="emoji">🌳 🦋 🐞 🦕 🌼</div></section><h2>Who is learning today?</h2><div class="grid">'+Object.entries(children).map(([k,c])=>'<article class="card"><div class="emoji">'+c.icon+'</div><h2>'+c.name+'</h2><p>'+c.desc+'</p><button onclick="library(\''+k+'\')">Open my library</button></article>').join('')+'</div><p class="notice">Progress is stored in this browser only, not shared across devices. No child accounts or personal information are collected.</p><button class="back" onclick="parent()">Parent overview</button>'}function library(c){who=c;const kid=children[c];app.innerHTML='<p><button class="back" onclick="home()">← All learners</button></p><section class="hero"><h1>'+kid.icon+' '+kid.name+'\'s Library</h1><p>'+kid.desc+'</p><p>'+lessons.filter((_,i)=>saved(c,i)).length+' of '+lessons.length+' adventures completed</p></section><div class="grid">'+lessons.map((l,i)=>'<article class="card"><div class="emoji">'+l[1]+'</div><p class="muted">'+l[2]+'</p><h2>'+l[0]+'</h2><p>'+(saved(c,i)?"✓ Completed — read again":"Ready to explore")+'</p><button onclick="openLesson('+i+')">Open story</button></article>').join('')+'</div>'}function openLesson(i){lesson=i;const l=lessons[i],n=who==="asher"?0:who==="joseph"?1:2;app.innerHTML='<p><button class="back" onclick="library(\''+who+'\')">← Library</button></p><h1>'+l[0]+'</h1><div class="scene">'+l[1]+'</div><article class="card"><p class="reading" id="story">'+l[3+n]+'</p><button onclick="speak()">🔊 Read aloud</button> <button class="back" onclick="speechSynthesis.cancel()">Stop</button></article><article class="card"><h2>Discover</h2><p class="reading">'+l[6+n*2]+'</p><div class="answers">'+l[7+n*2].map((a,j)=>'<button onclick="answer('+j+')">'+a+'</button>').join('')+'</div><p id="feedback" aria-live="polite"></p><div id="next"></div></article>'}function answer(j){document.getElementById("feedback").textContent=j===0?"Wonderful observation!":"Try again. Look closely at the story.";if(j===0){localStorage.setItem("fl:"+who+":"+lesson,"yes");document.getElementById("next").innerHTML='<button onclick="library(\''+who+'\')">Choose another adventure →</button>'}}function speak(){if(!("speechSynthesis" in window)){alert("Read aloud is not supported by this browser");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(document.getElementById("story").textContent);u.rate=.9;speechSynthesis.speak(u)}function parent(){app.innerHTML='<p><button class="back" onclick="home()">← Home</button></p><h1>Parent overview</h1><p class="notice">This local demonstration has no protected parent login. Do not enter private child information.</p><div class="grid">'+Object.entries(children).map(([k,c])=>'<div class="card"><h2>'+c.name+'</h2><p>'+lessons.filter((_,i)=>saved(k,i)).length+' / '+lessons.length+' adventures completed</p></div>').join('')+'</div><p><button onclick="backup()">Export progress backup</button></p><label>Restore backup <input type="file" accept=".json" onchange="restore(event)"></label>'}function backup(){const d={version:1,progress:{}};Object.keys(children).forEach(c=>lessons.forEach((_,i)=>d.progress["fl:"+c+":"+i]=saved(c,i)));const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));a.href=u;a.download="faithful-learner-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(e){try{const d=JSON.parse(await e.target.files[0].text());if(d.version!==1)throw Error();Object.entries(d.progress).forEach(([k,v])=>{if(/^fl:(asher|joseph|caleb):[0-5]$/.test(k)){if(v)localStorage.setItem(k,"yes");else localStorage.removeItem(k)}});parent()}catch(e){alert("Could not read this backup")}}home();
</script></body></html>
