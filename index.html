<canvas id="game" aria-label="Full screen illustrated exploration game"></canvas>
<div id="overlay"><div class="panel" id="panel"></div></div>
<div id="hud"><div class="hudbox"><b id="worldTitle">Living Forest</b><small id="whoTitle">Explore freely</small></div><button id="menuBtn" onclick="showWorlds()">☰ Worlds</button></div>
<div id="journal"><b>Discovery journal</b><div id="journalText"></div></div><div id="toast" aria-live="polite"></div><div id="hint" aria-live="polite"></div>
<div id="controls"><div class="pad"><button class="control" id="left" aria-label="Move left">◀</button><button class="control" id="right" aria-label="Move right">▶</button></div><button class="control action" id="interact" aria-label="Interact">Explore ✦</button></div>
<script>
const C=document.getElementById("game"),ctx=C.getContext("2d"),overlay=document.getElementById("overlay"),panel=document.getElementById("panel");let W=0,H=0,dpr=1,world="forest",kid="asher",playing=false,playerX=180,camera=0,last=0,clock=0,keys={left:false,right:false},nearest=null,toastUntil=0,particles=[],found={},grown=0;const WIDTH=3400;
const names={asher:"Asher",joseph:"Joseph",caleb:"Caleb"},worlds={forest:["The Living Forest","🌳","Walk among the trees, find creatures and follow the fireflies."],dino:["Dinosaur Valley","🦕","Explore a prehistoric valley, uncover fossils and meet dinosaurs."],garden:["The Growing Garden","🌻","Plant seeds, water flowers and watch the garden bloom."],sky:["The Starlight Trail","🌙","Travel through the night and awaken constellations."]};
const items={forest:[{x:530,id:"rabbit",icon:"🐇",text:"A rabbit darts through the grass! Its long ears help it listen."},{x:1070,id:"butterfly",icon:"🦋",text:"A butterfly visits flowers and carries pollen."},{x:1630,id:"bird",icon:"🐦",text:"A songbird welcomes you to the forest."},{x:2190,id:"fox",icon:"🦊",text:"A fox slips quietly between the trees."},{x:2860,id:"firefly",icon:"✨",text:"Fireflies glow in the evening air!"}],dino:[{x:510,id:"tracks",icon:"🐾",text:"Giant footprints! Follow the trail."},{x:1150,id:"fossil",icon:"🦴",text:"You uncovered an ancient fossil!"},{x:1800,id:"egg",icon:"🥚",text:"A dinosaur egg is nestled in the grass."},{x:2500,id:"dinosaur",icon:"🦕",text:"A gentle long-necked dinosaur reaches for leaves."},{x:3050,id:"crystal",icon:"💎",text:"A shining mineral is hidden in the rocks."}],garden:[{x:480,id:"seed1",icon:"🌱",text:"A tiny seed wakes up beneath the soil."},{x:1050,id:"seed2",icon:"🌱",text:"Roots stretch down, leaves reach toward the sun."},{x:1610,id:"pond",icon:"🐸",text:"A frog leaps beside the garden pond!"},{x:2220,id:"seed3",icon:"🌱",text:"A flower unfolds its petals."},{x:2940,id:"bee",icon:"🐝",text:"A bee buzzes among the blossoms."}],sky:[{x:520,id:"moon",icon:"🌙",text:"The Moon reflects sunlight into the night."},{x:1090,id:"owl",icon:"🦉",text:"An owl watches from a branch."},{x:1690,id:"stars",icon:"⭐",text:"A new constellation sparkles above you."},{x:2340,id:"comet",icon:"☄️",text:"A glowing comet crosses the distant sky."},{x:2990,id:"mountain",icon:"⛰️",text:"You reached the moonlit mountain."}]};
function saveKey(){return "faithful-game:"+kid+":"+world}function load(){try{found=JSON.parse(localStorage.getItem(saveKey())||"{}")}catch(e){found={}}}function save(){localStorage.setItem(saveKey(),JSON.stringify(found))}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=Math.round(W*dpr);C.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function rr(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function circ(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fill()}function text(t,x,y,size,color="#fff",align="center"){ctx.font="bold "+size+"px system-ui";ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}
function rand(n){let a=Math.sin(n*127.1+91.7)*43758.5453;return a-Math.floor(a)}function sky(){let night=world==="sky";let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,night?"#122447":world==="dino"?"#9ad6df":"#74c8dc");g.addColorStop(1,night?"#63779a":"#e5efd0");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(!night){circ(W*.78,H*.18,Math.min(58,H*.085),"#ffe9a3");for(let i=0;i<7;i++){let x=(i*260-camera*.12)%(W+300);if(x< -100)x+=W+300;ellipse(x,H*(.12+(i%3)*.08),80,22,"#ffffff88");ellipse(x+20,H*(.12+(i%3)*.08)-18,45,29,"#ffffff88")}}else{circ(W*.78,H*.16,48,"#ffefbd");for(let i=0;i<110;i++){let x=rand(i)*W,y=rand(i+400)*H*.65;circ(x,y,rand(i+800)*2+1,"#fff5c5")}}}
function hills(){let night=world==="sky";for(let layer=0;layer<3;layer++){let y=H*(.53+layer*.10),color=night?["#354d76","#3d5e72","#344e59"][layer]:world==="dino"?["#b5b28b","#92a97b","#7b986a"][layer]:["#a7d0aa","#7db58a","#528d70"][layer];ctx.beginPath();ctx.moveTo(0,H);for(let x=-20;x<=W+30;x+=18){let xx=x+camera*(.08+layer*.13);ctx.lineTo(x,y+Math.sin(xx/180+layer)*34+Math.cos(xx/95)*13)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=color;ctx.fill()}}
function tree(x,ground,s,night=false){ctx.save();ctx.translate(x,ground);ctx.scale(s,s);rr(-12,-135,24,150,5,night?"#3e3947":"#76563d");for(let j=0;j<3;j++){let cy=-160-j*26;circ((j-1)*23,cy,55-j*6,night?"#3b5d69":["#4d9169","#67a979","#78b989"][j])}ctx.restore()}
function worldDecor(){let floor=H*.79;ctx.fillStyle=world==="dino"?"#bd9468":world==="sky"?"#3d665b":"#609969";ctx.fillRect(0,floor,W,H-floor);for(let i=0;i<55;i++){let x=i*95-camera*.55;if(x<-80||x>W+80)continue;if(world==="forest"||world==="garden"||world==="sky"){tree(x,floor+35,(.4+rand(i)*.55),world==="sky")}else{poly([[x-85,floor],[x+20,floor-170-rand(i)*100],[x+135,floor]],i%2?"#a17d6e":"#b5967e")}}for(let i=0;i<200;i++){let x=i*39-camera;if(x<0||x>W)continue;let y=floor+20+rand(i+50)*(H-floor-30);if(world==="dino"){ellipse(x,y,5,2,"#e0bc91")}else{ctx.strokeStyle=i%3?"#a8c77a":"#d8d19a";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+6);ctx.lineTo(x-3,y-6);ctx.stroke();if(i%5===0)circ(x,y-9,4,world==="sky"?"#e1d7b3":"#eeb7a1")}}}
function drawItems(){nearest=null;let best=150;items[world].forEach((it,i)=>{let x=it.x-camera,y=H*.78-45+Math.sin(clock*1.6+i)*9;if(x< -110||x>W+110)return;let dist=Math.abs(it.x-playerX);if(dist<best){best=dist;nearest=it}ctx.save();ctx.translate(x,y);if(found[it.id]){circ(0,-45,40,"#ffe9a355");text("✓",0,-85,24,"#fff0b1")}else{circ(0,-45,42,"#ffffff26");ctx.strokeStyle="#fff8cc99";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-45,43,0,Math.PI*2);ctx.stroke()}text(it.icon,0,-25,64);if(dist<150)text("✦ Explore",0,15,17,"#fff7c5");ctx.restore()})}
function avatar(){let x=playerX-camera,y=H*.79;let bob=Math.sin(clock*(keys.left||keys.right?12:3))*3;ctx.save();ctx.translate(x,y+bob);ellipse(0,4,30,9,"#163a2c66");rr(-17,-61,34,48,12,kid==="asher"?"#f3ba64":kid==="joseph"?"#84c5e3":"#e5a9bb");rr(-14,-18,11,25,5,"#3b4e62");rr(4,-18,11,25,5,"#3b4e62");circ(0,-79,23,"#865b43");ctx.fillStyle="#2e2625";ctx.beginPath();ctx.arc(0,-87,24,Math.PI,Math.PI*2);ctx.fill();circ(-8,-79,2.5,"#241c19");circ(8,-79,2.5,"#241c19");ctx.strokeStyle="#51382b";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-72,7,0,Math.PI);ctx.stroke();ctx.restore()}
function effects(dt){particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=Math.max(0,p.life);circ(p.x-camera,p.y,3+p.life*3,p.color);ctx.globalAlpha=1})}
function draw(){ctx.clearRect(0,0,W,H);sky();hills();worldDecor();drawItems();avatar();effects(.016);if(!playing){ctx.fillStyle="#16382b66";ctx.fillRect(0,0,W,H)}}
function tick(ts){let dt=Math.min((ts-last)/1000||0,.05);last=ts;clock+=dt;if(playing){let dir=(keys.right?1:0)-(keys.left?1:0);playerX=Math.max(45,Math.min(WIDTH-45,playerX+dir*270*dt));let target=Math.max(0,Math.min(WIDTH-W,playerX-W*.35));camera+=(target-camera)*Math.min(1,dt*6);const hint=document.getElementById("hint");if(nearest){hint.textContent="✦ "+(found[nearest.id]?"Visit again: ":"Discover: ")+nearest.icon+" — press Explore";hint.classList.add("show")}else{hint.textContent="Move through the world with ◀ ▶ or your keyboard arrows";hint.classList.add("show")}}draw();requestAnimationFrame(tick)}
function celebrate(x){for(let i=0;i<28;i++)particles.push({x:x,y:H*.67,vx:(rand(i+clock)*2-1)*130,vy:-rand(i+40)*180,life:1.2,color:["#fff0a0","#f3bc88","#d1f6ce"][i%3]})}
function interact(){if(!playing||!nearest)return;let it=nearest;found[it.id]=true;save();celebrate(it.x);let count=Object.keys(found).filter(k=>found[k]).length;document.getElementById("journalText").textContent=count+" / "+items[world].length+" discoveries";document.getElementById("journal").classList.add("show");const t=document.getElementById("toast");t.textContent=it.icon+" "+it.text+(count===items[world].length?" 🏆 World explored!":"");t.classList.add("show");toastUntil=Date.now()+3800;setTimeout(()=>{if(Date.now()>=toastUntil)t.classList.remove("show")},3900);if(world==="garden"&&it.id.startsWith("seed"))grown++;if(count===items[world].length){localStorage.setItem("faithful-game:complete:"+kid+":"+world,"yes");for(let i=0;i<50;i++)particles.push({x:playerX+(rand(i+12)-.5)*300,y:H*.4+rand(i)*H*.2,vx:(rand(i+40)-.5)*70,vy:-rand(i+60)*90,life:2,color:"#ffe28a"})}}
function selectKid(k){kid=k;showWorlds()}function showKids(){playing=false;keys.left=keys.right=false;overlay.classList.remove("off");document.getElementById("hud").classList.remove("show");document.getElementById("controls").classList.remove("show");document.getElementById("hint").classList.remove("show");document.getElementById("journal").classList.remove("show");panel.innerHTML='<div style="font-size:2.5rem">🌳 🦕 🌼 🌙</div><h1>Faithful Learner</h1><p>Step inside a living world. Walk, explore, discover animals and uncover the wonders of creation.</p><h2>Who is exploring?</h2><div class="options">'+Object.entries(names).map(([k,n])=>'<button class="option" onclick="selectKid(\''+k+'\')"><span>'+(k==="asher"?"🔎":k==="joseph"?"🦋":"🐞")+'</span><b>'+n+'</b><small>'+(k==="asher"?"Investigator":k==="joseph"?"Discoverer":"Little explorer")+'</small></button>').join("")+'</div><p style="font-size:.9rem">Play on a phone, tablet or computer. Progress stays on this device.</p>'}
function showWorlds(){playing=false;keys.left=keys.right=false;overlay.classList.remove("off");document.getElementById("hud").classList.remove("show");document.getElementById("controls").classList.remove("show");document.getElementById("hint").classList.remove("show");panel.innerHTML='<button onclick="showKids()" style="background:transparent;color:#24533f">← Change explorer</button><h1>'+names[kid]+"'s Adventures"+'</h1><p>Choose a world to enter. No quizzes or worksheets — just move, explore and discover.</p><div class="options">'+Object.entries(worlds).map(([id,w])=>'<button class="option" onclick="start(\''+id+'\')"><span>'+w[1]+'</span><b>'+w[0]+'</b><small>'+w[2]+'</small><small>'+(localStorage.getItem("faithful-game:complete:"+kid+":"+id)?"🏆 Explored":"✦ New adventure")+'</small></button>').join("")+'</div>'}
function start(id){world=id;load();playerX=180;camera=0;playing=true;overlay.classList.add("off");document.getElementById("hud").classList.add("show");document.getElementById("controls").classList.add("show");document.getElementById("worldTitle").textContent=worlds[id][0];document.getElementById("whoTitle").textContent=names[kid]+" · Walk and discover";document.getElementById("journal").classList.add("show");document.getElementById("journalText").textContent=Object.keys(found).filter(k=>found[k]).length+" / "+items[world].length+" discoveries";document.getElementById("toast").classList.remove("show")}
function bindHold(id,dir){const el=document.getElementById(id);const on=e=>{e.preventDefault();keys[dir]=true;try{el.setPointerCapture(e.pointerId)}catch(err){}};const off=e=>{e.preventDefault();keys[dir]=false};el.addEventListener("pointerdown",on);el.addEventListener("pointerup",off);el.addEventListener("pointercancel",off);el.addEventListener("lostpointercapture",()=>keys[dir]=false)}
bindHold("left","left");bindHold("right","right");document.getElementById("interact").addEventListener("pointerdown",e=>{e.preventDefault();interact()});addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight"," ","e","E"].includes(e.key))e.preventDefault();if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;if(e.key==="ArrowRight"||e.key==="d")keys.right=true;if((e.key===" "||e.key==="e"||e.key==="E")&&!e.repeat)interact();if(e.key==="Escape"&&playing)showWorlds()});addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;if(e.key==="ArrowRight"||e.key==="d")keys.right=false});addEventListener("blur",()=>{keys.left=keys.right=false});C.addEventListener("pointerdown",e=>{if(!playing)return;let x=e.clientX;if(nearest&&Math.abs(nearest.x-camera-x)<90){interact();return}keys[x<W*.5?"left":"right"]=true});C.addEventListener("pointerup",()=>keys.left=keys.right=false);C.addEventListener("pointercancel",()=>keys.left=keys.right=false);showKids();requestAnimationFrame(tick);
</script><div id="quest"></div><div id="activity"><div class="activity-card" id="activityCard"></div></div><div id="chapter"></div><script>
/* Adventure chapter: context-sensitive hands-on interactions, quests and richer scenes. */
let questStep=0,activityOpen=false,weatherMode=0,sceneSparkles=0,questFlags={};const originalStart=start,originalDraw=draw,originalInteract=interact,originalShowWorlds=showWorlds,originalShowKids=showKids;
const story={forest:{title:"The Whispering Woods",goal:"Follow the animal trail and restore the forest lanterns.",acts:["Find the rabbit's trail","Help a butterfly reach the flowers","Listen for the songbird","Discover the fox's den","Light the firefly grove"]},dino:{title:"The Lost Valley",goal:"Become a fossil explorer and uncover the valley's secrets.",acts:["Follow giant footprints","Brush away the fossil","Care for the hidden egg","Meet the long-neck dinosaur","Discover the crystal cave"]},garden:{title:"The Garden Awakens",goal:"Bring a sleeping garden to life.",acts:["Plant the first seed","Grow a second plant","Visit the pond","Help the flower bloom","Welcome the pollinator"]},sky:{title:"The Night Journey",goal:"Explore the sky and illuminate the mountain path.",acts:["Observe the moon","Meet the night owl","Connect the stars","Watch the comet","Reach the mountain summit"]}};
function updateQuest(){const q=document.getElementById("quest");if(!playing){q.classList.remove("show");return}let done=items[world].filter(a=>found[a.id]).length;q.classList.add("show");q.innerHTML='<b>Chapter · '+story[world].title+'</b><p>'+(done===items[world].length?'🏆 Chapter complete!':story[world].acts[Math.min(done,4)])+'</p><small>'+done+' / '+items[world].length+' discoveries · '+(done===items[world].length?'World restored':'Explore the glowing landmarks')+'</small>'}
start=function(id){originalStart(id);questStep=0;activityOpen=false;updateQuest();const c=document.getElementById("chapter");c.textContent=story[id].title;c.classList.add("show");setTimeout(()=>c.classList.remove("show"),2200)};

const curriculum={
caleb:[["👂","Listen and Find","Tap what you hear."],["🐦","Count the Birds","Touch each bird to count."],["🌱","Grow a Seed","Care for a seed and watch it grow."],["🎨","Draw and Trace","Draw a path to the quiet tree."],["💚","Helping Hands","Choose ways to help others."],["📖","Story Time","Listen to a story about creation."]],
joseph:[["🔤","Build a Word","Arrange letters to spell a nature word."],["🔢","Number Trail","Count creatures and solve number stories."],["🌱","Garden Science","Put plant growth in order."],["✍️","Write and Draw","Write a word and illustrate it."],["👂","Listening Adventure","Follow a spoken instruction."],["📖","Living Story","Listen and read a short story."]],
asher:[["🔎","Nature Investigator","Collect observations and describe evidence."],["📖","Read and Respond","Read a short passage and write a response."],["🔤","Hebrew Word Study","Learn שמע, shama: to hear or listen."],["🧮","Math Expedition","Solve problems with discoveries."],["🌿","Science Laboratory","Explain how plants grow."],["🎨","Field Journal","Draw and label what you observed."]]
};
let lessonIndex=-1,lessonStage=0,lessonAnswers=[],drawing=false,academyActive=false;let lessonProgress={};
function lessonKey(){return "faithful-lessons:"+kid}function loadLessons(){try{lessonProgress=JSON.parse(localStorage.getItem(lessonKey())||"{}")}catch(e){lessonProgress={}}}function saveLessons(){localStorage.setItem(lessonKey(),JSON.stringify(lessonProgress))}
function academyShell(title,body){document.getElementById("schoolContent").innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>'+names[kid]+' · '+childModes[kid].label+'</b><button class="secondary" onclick="closeAcademy()">✕ Close</button></div><h2>'+title+'</h2>'+body}
function openAcademy(){if(!playing)return;stopVoice();academyActive=true;keys.left=keys.right=false;document.getElementById("academy").classList.add("show");lessonIndex=-1;loadLessons();showLessons()}
function closeAcademy(){academyActive=false;stopVoice();document.getElementById("academy").classList.remove("show");lessonIndex=-1}
function showLessons(){let tiles=curriculum[kid].map((l,i)=>'<button class="lesson-tile" onclick="openLesson('+i+')"><span>'+l[0]+'</span>'+l[1]+'<div style="font-size:.8rem;margin-top:8px">'+(lessonProgress[i]?"✓ Practiced":"Explore lesson")+'</div></button>').join("");academyShell("Learning Adventures",'<p>Choose an activity. Learn by listening, moving, building, drawing, and discovering. Nothing is timed.</p><div class="lesson-grid">'+tiles+'</div>');say("Choose a learning adventure. You can take all the time you need.")}
function openLesson(i){lessonIndex=i;lessonStage=0;lessonAnswers=[];renderLesson()}
function lessonTools(){return '<div class="tools"><button onclick="repeatVoice()">🔊 Hear again</button><button class="secondary" onclick="showLessons()">All lessons</button></div>'}
function renderLesson(){let l=curriculum[kid][lessonIndex],i=lessonIndex;let body="";if(kid==="caleb"){
if(i===0)body='<p>Listen carefully. Which things make sounds? Tap them.</p><div class="task" id="response">'+["🐦 Bird","🍃 Leaves","🐕 Dog","🪨 Rock"].map((v,j)=>'<button onclick="touchLesson('+j+')">'+v+'</button>').join("")+'</div>';
if(i===1)body='<p>Touch each bird. Count aloud with me.</p><div class="task" id="response">'+[0,1,2,3].map(j=>'<button onclick="touchLesson('+j+')">🐦</button>').join("")+'</div><p id="countReadout">Birds counted: 0</p>';
if(i===2)body='<p>Help the seed grow. First soil, then water, then sunshine.</p><div class="task" id="response"><div id="growth" style="font-size:5rem;text-align:center">🟤</div><button onclick="touchLesson(0)">🌱 Plant</button><button onclick="touchLesson(1)">💧 Water</button><button onclick="touchLesson(2)">☀️ Sunshine</button></div>';
if(i===3)body='<p>Draw a path from the child to the tree.</p>'+drawMarkup();
if(i===4)body='<p>How can we help someone today? Touch the pictures.</p><div class="task" id="response">'+["🤝 Help","🧹 Clean","📚 Share a book"].map((x,j)=>'<button onclick="touchLesson('+j+')">'+x+'</button>').join("")+'</div>';
if(i===5)body='<p>Yahuah made the sky, the land, and living creatures. Look around the world. What can you see?</p><div class="task" id="response">'+["🌞 Sun","🌳 Tree","🐦 Bird"].map((x,j)=>'<button onclick="touchLesson('+j+')">'+x+'</button>').join("")+'</div>';
}else if(kid==="joseph"){
if(i===0)body='<p>Build the word <b>HEAR</b>. Tap the letters in order.</p><div class="task"><div id="wordReadout" style="font-size:2rem;letter-spacing:.25em">_ _ _ _</div><div id="response">'+["R","E","H","A"].map((x,j)=>'<button onclick="touchLesson('+j+')">'+x+'</button>').join("")+'</div></div>';
if(i===1)body='<p>There are three birds in one tree and two in another. How many birds altogether?</p><div style="font-size:3rem">🐦🐦🐦 + 🐦🐦</div><div class="task" id="response">'+[4,5,6].map((x,j)=>'<button onclick="touchLesson('+j+')">'+x+'</button>').join("")+'</div>';
if(i===2)body='<p>Put the stages of plant growth in order. Tap each picture.</p><div class="task" id="response">'+["🌻 Flower","🌱 Sprout","🫘 Seed"].map((x,j)=>'<button onclick="touchLesson('+j+')">'+x+'</button>').join("")+'</div><p id="wordReadout">First → next → last</p>';
if(i===3)body='<p>Write one word about nature. Then draw it.</p><input id="written" placeholder="Write a word"><p></p>'+drawMarkup();
if(i===4)body='<p>Listen, then choose the animal that flies.</p><div class="task" id="response">'+["🐇 Rabbit","🐦 Bird","🐢 Turtle"].map((x,j)=>'<button onclick="touchLesson('+j+')">'+x+'</button>').join("")+'</div>';
if(i===5)body='<p>The bird sat in a tall tree. A soft wind moved the leaves. The bird sang, and the forest grew quiet to listen.</p><div class="task"><button onclick="say(\'The bird sat in a tall tree. A soft wind moved the leaves. The bird sang, and the forest grew quiet to listen.\',true)">🔊 Read story</button></div><p>Draw what you imagined.</p>'+drawMarkup();
}else{
if(i===0)body='<p>Observe the living forest. What evidence shows that animals live here? Record two observations.</p><textarea id="notes" style="width:100%;height:120px;font:inherit;font-size:1.1rem;padding:12px" placeholder="I observed..."></textarea>';
if(i===1)body='<p>Read: “A bird builds a nest to shelter its young. The branches offer protection, and the forest provides food.”</p><p>Explain why the tree is important to the bird.</p><textarea id="notes" style="width:100%;height:120px;font:inherit;font-size:1.1rem;padding:12px"></textarea>';
if(i===2)body='<p><b>שמע — shama</b> means to hear or listen, often with attention and response. Practice the word, then write what attentive listening looks like.</p><input id="written" placeholder="Listening means..."><p>Reference: Deuteronomy 6:4.</p>';
if(i===3)body='<p>Five birds were in the forest. Two flew away and three arrived. How many birds are there now?</p><div class="task" id="response">'+[5,6,7].map((x,j)=>'<button onclick="touchLesson('+j+')">'+x+'</button>').join("")+'</div><p id="wordReadout"></p>';
if(i===4)body='<p>Investigate how a seed becomes a plant. What roles do water, light, and soil play?</p><textarea id="notes" style="width:100%;height:120px;font:inherit;font-size:1.1rem;padding:12px"></textarea>';
if(i===5)body='<p>Sketch an animal or plant from your journey and label two details you noticed.</p>'+drawMarkup()+'<input id="written" placeholder="Labels or observations">';
}
academyShell(l[0]+" "+l[1],'<p>'+l[2]+'</p>'+body+lessonTools()+'<div class="tools"><button onclick="finishLesson()">✓ Save my learning</button></div><p id="lessonFeedback" aria-live="polite"></p>');if(document.getElementById("drawBoard"))initDraw();say(l[1]+". "+document.getElementById("schoolContent").querySelectorAll("p")[0].textContent+" "+(document.getElementById("schoolContent").querySelectorAll("p")[1]?.textContent||""))}
function drawMarkup(){return '<canvas id="drawBoard" width="800" height="230" aria-label="Drawing canvas"></canvas><div class="tools"><button onclick="clearDraw()">Clear drawing</button></div>'}
function initDraw(){let c=document.getElementById("drawBoard"),g=c.getContext("2d");g.strokeStyle="#3b7255";g.lineWidth=5;g.lineCap="round";function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);g.beginPath();g.moveTo(...pos(e))};c.onpointermove=e=>{if(drawing){g.lineTo(...pos(e));g.stroke()}};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false}
function clearDraw(){let c=document.getElementById("drawBoard");if(c)c.getContext("2d").clearRect(0,0,c.width,c.height)}
function touchLesson(j){let i=lessonIndex,fb=document.getElementById("lessonFeedback"),r=document.getElementById("response");lessonAnswers.push(j);let m="Good exploring. Keep going.";if(kid==="caleb"){if(i===1){let n=new Set(lessonAnswers).size;document.getElementById("countReadout").textContent="Birds counted: "+n;m="You counted "+n+" bird"+(n===1?"":"s")+". "+(n===4?"There are four birds.":"Touch another bird.")}else if(i===2){document.getElementById("growth").textContent=["🌱","🌿","🌻"][Math.min(lessonAnswers.length-1,2)];m=["A seed begins to grow.","Water helps the roots.","Sunlight helps the plant grow."][Math.min(lessonAnswers.length-1,2)]}else m=["Look and listen.","You found something.","Keep discovering."][Math.min(lessonAnswers.length-1,2)]}
else if(kid==="joseph"){if(i===0){let letters=["R","E","H","A"],v=lessonAnswers.map(x=>letters[x]).join("");document.getElementById("wordReadout").textContent=v;m=v==="HEAR"?"You spelled HEAR!":v.length>=4?"Try again. The word is H E A R.":"Listen to the letters: H E A R."}if(i===1)m=j===1?"Yes. Three plus two is five.":"Count again. Three birds plus two birds.";if(i===2){let seq=["🌻","🌱","🫘"];document.getElementById("wordReadout").textContent=lessonAnswers.map(x=>seq[x]).join(" → ");m=lessonAnswers.join(",")==="2,1,0"?"Yes! Seed, sprout, flower.":"A plant begins as a seed."}if(i===4)m=j===1?"Yes. A bird can fly.":"Think about wings. Which animal has wings?"}
else if(i===3)m=j===1?"Correct. Five minus two plus three equals six.":"Try counting what remains and what arrives.";
if(r&&r.children[j])r.children[j].classList.add("selected");if(fb)fb.textContent=m;say(m)}
function finishLesson(){lessonProgress[lessonIndex]=true;saveLessons();let fb=document.getElementById("lessonFeedback");if(fb)fb.textContent="Your learning is saved. You can practice this again whenever you like.";say("Your learning is saved. You can practice again, or choose another adventure.")}
const academyStart=start;start=function(id){academyStart(id);document.getElementById("academyBtn").classList.add("show")};
const academyWorlds=showWorlds;showWorlds=function(){closeAcademy();academyWorlds();document.getElementById("academyBtn").classList.remove("show")};
const academyKids=showKids;showKids=function(){closeAcademy();academyKids();document.getElementById("academyBtn").classList.remove("show")};
</script></body></html>
