<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wonder City — Living 4D World</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#89c9ef;color:#fff;font:600 15px system-ui}#world{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}header{position:absolute;top:16px;left:18px;text-shadow:0 3px 9px #123}header b{font-size:clamp(24px,4vw,40px)}header small{display:block;letter-spacing:2px}#status{position:absolute;top:20px;right:20px;background:#142d48bb;border:1px solid #fff5;border-radius:15px;padding:10px 15px}#message{position:absolute;bottom:95px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:20px;background:#142d48cc;max-width:90vw;text-align:center}#pad{position:absolute;bottom:15px;left:16px;display:flex;gap:10px;pointer-events:auto}button{border:2px solid #fff9;background:#f5e8ca;color:#28465a;border-radius:15px;padding:14px 20px;font-weight:900;font-size:18px;cursor:pointer;touch-action:none}#choose{position:fixed;inset:0;display:grid;place-items:center;background:#152c4cc9;z-index:5}#choose article{background:#fff8e8;color:#21455a;padding:26px;border-radius:25px;text-align:center;width:min(500px,92vw)}#choose button{margin:5px}#fallback{display:none;position:fixed;inset:0;z-index:8;background:#17354b;color:white;padding:12vh 8vw;text-align:center}#fallback a{color:#ffdd99}#enter{position:absolute;right:16px;bottom:16px;pointer-events:auto}body.playing #choose{display:none}</style></head><body><div id="world"></div><div id="hud"><header><b>WONDER CITY</b><small>THE LIVING 4D WORLD</small></header><div id="status">DAY 1 · MORNING</div><div id="message">Choose your explorer to enter the city.</div><div id="pad"><button id="left">◀</button><button id="right">▶</button><button id="jump">JUMP</button></div><button id="enter">EXPLORE</button></div><div id="choose"><article><h1>Welcome to Wonder City</h1><p>Explore a living city with Axel the axolotl.</p><button data-child="Asher">Asher</button><button data-child="Joseph">Joseph</button><button data-child="Caleb">Caleb</button></article></div><div id="fallback"><h1>3D couldn't start on this device.</h1><p>The original playable Wonder City is still available.</p><a href="./index.html">Open the original city</a></div><script type="module">
let THREE;try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js')}catch(e){document.querySelector('#fallback').style.display='block';throw e}
const {Scene,Color,PerspectiveCamera,WebGLRenderer,AmbientLight,DirectionalLight,HemisphereLight,PlaneGeometry,BoxGeometry,SphereGeometry,CylinderGeometry,Mesh,MeshStandardMaterial,Group,FogExp2,Vector3,Clock}=THREE;
let renderer;try{renderer=new WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#world').appendChild(renderer.domElement)}catch(e){document.querySelector('#fallback').style.display='block';throw e}
const scene=new Scene();scene.background=new Color('#8bc9f0');scene.fog=new FogExp2('#b8d9e8',.009);const camera=new PerspectiveCamera(58,innerWidth/innerHeight,.1,800);const ambient=new HemisphereLight('#e3f4ff','#5d7358',2.1);scene.add(ambient);const sun=new DirectionalLight('#fff1cc',2.8);sun.position.set(-50,90,55);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-100;sun.shadow.camera.right=100;sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;scene.add(sun);
const mat=(c,r=1)=>new MeshStandardMaterial({color:c,roughness:r});const road=mat('#3d5061'),grass=mat('#4e9563'),sidewalk=mat('#bfc6bd'),windowMat=mat('#8ac4d9',.24),lamp=mat('#ffe6a0');function cube(w,h,d,m,x,y,z,shadow=false){const o=new Mesh(new BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}function ball(r,m,x,y,z){const o=new Mesh(new SphereGeometry(r,12,9),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
cube(500,.2,180,grass,0,-.2,0);cube(500,.08,15,road,0,.02,0);cube(500,.12,3,sidewalk,0,.08,10);cube(500,.12,3,sidewalk,0,.08,-10);
for(let x=-240;x<245;x+=10){cube(4,.02,.15,mat('#e9dbad'),x,.09,0)}
const colors=['#cf998f','#e6c09a','#a5bac9','#d1abc5','#c9c5a0','#b8cfba'];for(let x=-220;x<=220;x+=11){for(const side of [-1,1]){if(x>-38&&x<42&&side===1)continue;const seed=Math.abs(Math.round(x*7+side*37)),h=9+(seed%9)*2.8,d=8+(seed%3)*2;const z=side*(19+d/2);cube(8,h,d,mat(colors[seed%colors.length]),x,h/2,z,true);cube(8.3,.4,d+.3,mat('#657988'),x,h+.15,z);for(let y=3;y<h-1;y+=3.6){for(let j=-1;j<=1;j++){cube(1.1,1.65,.07,windowMat,x+j*2.3,y,z-side*(d/2+.05))}}}}
for(let x=-220;x<220;x+=15){for(const side of [-1,1]){if(side===1&&x>-40&&x<45)continue;const z=side*12;const trunk=new Mesh(new CylinderGeometry(.25,.4,3,7),mat('#786047'));trunk.position.set(x,1.5,z);scene.add(trunk);ball(2.1,mat('#3e8757'),x,4,z);ball(1.6,mat('#5b9b66'),x+1.1,4.4,z)}}
cube(80,.08,46,grass,0,.02,41);for(let x=-32;x<=32;x+=8)for(let z=23;z<=60;z+=9){if((x+z)%3!==0)ball(1.5,mat('#46935c'),x,1.7,z)}cube(70,.1,3,mat('#dfcfae'),0,.1,38);
const player=new Group();const torso=new Mesh(new BoxGeometry(1.25,1.6,.75),mat('#e9a74e'));torso.position.y=2.1;player.add(torso);const head=new Mesh(new SphereGeometry(.67,16,12),mat('#98664c'));head.position.y=3.32;player.add(head);const hair=new Mesh(new SphereGeometry(.7,16,10),mat('#252c31'));hair.position.y=3.68;hair.scale.y=.48;player.add(hair);for(const dx of [-.34,.34]){const leg=new Mesh(new BoxGeometry(.38,1.15,.5),mat('#2d6487'));leg.position.set(dx,.7,0);player.add(leg)}scene.add(player);
const axel=new Group();const axbody=new Mesh(new SphereGeometry(.65,14,12),mat('#e7a5bb'));axbody.scale.set(1.5,.65,.75);axel.add(axbody);for(const s of [-1,1]){const gill=new Mesh(new SphereGeometry(.27,9,8),mat('#e87f9e'));gill.position.set(-.38,.35,s*.55);axel.add(gill)}axel.position.set(2,1.1,1);scene.add(axel);
const cars=[];for(let i=0;i<12;i++){const c=new Group();const body=new Mesh(new BoxGeometry(3,1.1,1.6),mat(colors[i%colors.length]));body.position.y=.85;c.add(body);const roof=new Mesh(new BoxGeometry(1.7,.65,1.4),mat('#c9e6ee'));roof.position.set(-.2,1.6,0);c.add(roof);c.position.set(i*33-200,0,i%2?3.5:-3.5);scene.add(c);cars.push(c)}
const controls={left:false,right:false};for(const k of ['left','right']){const el=document.getElementById(k);el.onpointerdown=e=>{controls[k]=true;el.setPointerCapture(e.pointerId)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>controls[k]=false)}let jump=0;document.querySelector('#jump').onclick=()=>{if(jump===0)jump=1};addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')controls.left=true;if(e.key==='ArrowRight'||e.key==='d')controls.right=true;if(e.key===' ')jump=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')controls.left=false;if(e.key==='ArrowRight'||e.key==='d')controls.right=false});let name='',pos=0,elapsed=0;document.querySelectorAll('[data-child]').forEach(b=>b.onclick=()=>{name=b.dataset.child;document.body.classList.add('playing');document.querySelector('#message').textContent='Welcome, '+name+'! Explore the living city with Axel.'});document.querySelector('#enter').onclick=()=>{document.querySelector('#message').textContent=pos>-40&&pos<42?'Welcome to the park! Find the trees and explore.':'Keep exploring — the city changes as time passes.'};const clock=new Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(name){pos+=((controls.right?1:0)-(controls.left?1:0))*dt*12;pos=Math.max(-210,Math.min(210,pos))}elapsed+=dt;const day=(elapsed/150)%1;const light=.65+.35*Math.sin(day*Math.PI*2);ambient.intensity=1.4+light*.7;sun.intensity=1+light*2;scene.background.setHSL(.56,.65,.36+light*.32);scene.fog.color.copy(scene.background);sun.position.set(Math.cos(day*6.28)*90,35+Math.sin(day*6.28)*60,50);document.querySelector('#status').textContent='DAY '+(1+Math.floor(elapsed/150))+' · '+(day<.25?'MORNING':day<.5?'AFTERNOON':day<.75?'EVENING':'NIGHT');player.position.set(pos,jump?Math.sin(jump*Math.PI)*1.5:0,11.3);if(jump){jump+=dt*1.8;if(jump>=1)jump=0}axel.position.set(pos+2,1.1+Math.sin(elapsed*3)*.18,12.2);for(let i=0;i<cars.length;i++){const c=cars[i];c.position.x+=(i%2?1:-1)*dt*(4+i%4);if(c.position.x>240)c.position.x=-240;if(c.position.x< -240)c.position.x=240}const target=new Vector3(pos+2,3,11);camera.position.lerp(new Vector3(pos-16,12,36),Math.min(1,dt*2.2));camera.lookAt(target);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
